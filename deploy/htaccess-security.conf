# ---------------------------------------------------------------------------
# Paste this block at the TOP of /home/kuhuorgi/ipo.kuhu.org.in/.htaccess
# (cPanel → File Manager → ipo.kuhu.org.in → .htaccess → Edit).
# Leave the existing "DO NOT EDIT" Passenger block below it untouched.
# It stops Apache from handing out private files directly.
# ---------------------------------------------------------------------------
# BEGIN ipo-security
Options -Indexes

<IfModule mod_rewrite.c>
RewriteEngine On
# Hidden files and folders (.env, .git, .htaccess) — but keep .well-known for SSL renewal
RewriteRule (^|/)\.(?!well-known(/|$)) - [F,L]
# Private folders
RewriteRule ^(data|tmp|nginx|deploy|__pycache__|venv|\.kiro)(/|$) - [F,L]
</IfModule>

# Private file types: source code, database, logs, spreadsheets, backups, docs
<FilesMatch "\.(py|pyc|sqlite|sqlite3|db|log|env|xlsx|xls|csv|bak|backup|md|txt|yml|yaml|sh|bat|conf|ini|example|lock)$">
    Require all denied
</FilesMatch>
# END ipo-security
